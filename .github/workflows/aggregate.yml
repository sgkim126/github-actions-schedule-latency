name: Aggregate schedule latency

on:
  schedule:
    - cron: "26 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out latest main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - name: Check out observations
        uses: actions/checkout@v7
        with:
          ref: measurements
          path: raw-measurements
          sparse-checkout: observations
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build and persist statistics
        run: |
          set -euo pipefail

          now="$(date -u +'%Y-%m-%dT%H:%M:%S+00:00')"
          branch="main"
          remote_ref="refs/remotes/origin/$branch"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          attempt=0
          max_attempts=5
          last_pushed_commit=""
          while true; do
            attempt=$((attempt + 1))

            fetch_status=0
            git fetch --no-tags origin "+refs/heads/$branch:$remote_ref" || fetch_status=$?
            if (( fetch_status != 0 )); then
              if (( attempt >= max_attempts )); then
                printf 'Fetch failed after %s attempts with status %s.\n' "$attempt" "$fetch_status"
                exit "$fetch_status"
              fi

              sleep_seconds=$((attempt < 10 ? attempt : 10))
              printf 'Fetch failed with status %s; retrying attempt %s after %ss.\n' \
                "$fetch_status" "$((attempt + 1))" "$sleep_seconds"
              sleep "$sleep_seconds"
              continue
            fi

            if [[ -n "$last_pushed_commit" && "$(git rev-parse "$remote_ref")" == "$last_pushed_commit" ]]; then
              printf 'The previous push was reflected on the remote despite its failure status.\n'
              exit 0
            fi

            git checkout -B statistics-write "$remote_ref"
            python3 scripts/measurement.py \
              --observations raw-measurements/observations \
              --now "$now"

            if [[ -z "$(git status --porcelain -- data/summary.csv)" ]]; then
              printf 'Statistics are already up to date.\n'
              exit 0
            fi

            git add -- data/summary.csv
            git commit -m "aggregate: $now"
            last_pushed_commit="$(git rev-parse HEAD)"

            push_status=0
            git push origin "HEAD:refs/heads/$branch" || push_status=$?
            if (( push_status == 0 )); then
              exit 0
            fi

            if git fetch --no-tags origin "+refs/heads/$branch:$remote_ref"; then
              if [[ "$(git rev-parse "$remote_ref")" == "$last_pushed_commit" ]]; then
                printf 'The push was reflected on the remote despite its failure status.\n'
                exit 0
              fi
            else
              printf 'Could not verify whether the failed push was reflected on the remote.\n'
            fi

            if (( attempt >= max_attempts )); then
              printf 'Push failed after %s attempts with status %s.\n' "$attempt" "$push_status"
              exit "$push_status"
            fi

            sleep_seconds=$((attempt < 10 ? attempt : 10))
            printf 'Push failed with status %s; rebuilding and retrying attempt %s after %ss.\n' \
              "$push_status" "$((attempt + 1))" "$sleep_seconds"
            sleep "$sleep_seconds"
          done
