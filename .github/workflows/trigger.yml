permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Capture runner start
        shell: bash
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          observed_at="$(date -u +'%Y-%m-%dT%H:%M:%S+00:00')"
          printf '%s\n' "$observed_at" > "$RUNNER_TEMP/observed_at.txt"
          printf 'Observed at %s for cron %s.\n' "$observed_at" "$CRON"
          {
            printf '### Trigger observation\n\n'
            printf '| Field | Value |\n'
            printf '| --- | --- |\n'
            printf '| Observed at (UTC) | `%s` |\n' "$observed_at"
            printf '| Scheduled cron | `%s` |\n' "$CRON"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: true

      - name: Append observation to measurements branch
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          observed_at="$(< "$RUNNER_TEMP/observed_at.txt")"
          read -r minute hour day month weekday extra <<< "$CRON"
          if [[ ! "$minute" =~ ^[0-9]+$ || ! "$hour" =~ ^[0-9]+$ || \
                "$day" != "*" || "$month" != "*" || "$weekday" != "*" || -n "${extra:-}" ]]; then
            printf 'Unsupported schedule: %s\n' "$CRON"
            exit 1
          fi

          minute_value=$((10#$minute))
          hour_value=$((10#$hour))
          if (( minute_value > 59 || minute_value % 5 != 0 || hour_value > 23 )); then
            printf 'Unsupported schedule: %s\n' "$CRON"
            exit 1
          fi

          minute="$minute_value"
          hour="$hour_value"
          observed_date="${observed_at%%T*}"
          scheduled_at="$(date -u --date "$observed_date $hour:$minute:00" +'%Y-%m-%dT%H:%M:%S+00:00')"
          observed_epoch="$(date -u --date "$observed_at" +'%s')"
          scheduled_epoch="$(date -u --date "$scheduled_at" +'%s')"
          if (( scheduled_epoch > observed_epoch )); then
            scheduled_at="$(date -u --date "$scheduled_at - 1 day" +'%Y-%m-%dT%H:%M:%S+00:00')"
          fi

          observation_file="$RUNNER_TEMP/observation.jsonl"
          jq -cn \
            --arg scheduled_at_utc "$scheduled_at" \
            --arg observed_at_utc "$observed_at" \
            '{scheduled_at_utc: $scheduled_at_utc, observed_at_utc: $observed_at_utc}' \
            > "$observation_file"
          observation="$(< "$observation_file")"

          branch="measurements"
          remote_ref="refs/remotes/origin/$branch"
          cron_file="${hour}_${minute}.jsonl"
          path="observations/$cron_file"
          attempt=0
          max_attempts=5
          last_pushed_commit=""

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while true; do
            attempt=$((attempt + 1))

            fetch_status=0
            git fetch --depth=1 --no-tags origin "+refs/heads/$branch:$remote_ref" || fetch_status=$?
            if (( fetch_status != 0 )); then
              if (( attempt >= max_attempts )); then
                printf 'Fetch failed after %s attempts with status %s.\n' "$attempt" "$fetch_status"
                exit "$fetch_status"
              fi

              sleep_seconds=$((attempt < 10 ? attempt : 10))
              printf 'Fetch failed with status %s; retrying attempt %s after %ss.\n' \
                "$fetch_status" "$((attempt + 1))" "$sleep_seconds"
              sleep "$sleep_seconds"
              continue
            fi

            if [[ -n "$last_pushed_commit" && "$(git rev-parse "$remote_ref")" == "$last_pushed_commit" ]]; then
              printf 'The previous push was reflected on the remote despite its failure status.\n'
              exit 0
            fi

            git checkout -B observation-write "$remote_ref"
            mkdir -p observations
            if [[ -f "$path" ]] && grep -Fqx -- "$observation" "$path"; then
              printf 'Observation is already present on the remote branch.\n'
              exit 0
            fi

            printf '%s\n' "$observation" >> "$path"
            git add -- "$path"
            git commit -m "trigger: $scheduled_at"
            last_pushed_commit="$(git rev-parse HEAD)"

            push_status=0
            git push origin "HEAD:refs/heads/$branch" || push_status=$?
            if (( push_status == 0 )); then
              exit 0
            fi

            if git fetch --depth=1 --no-tags origin "+refs/heads/$branch:$remote_ref"; then
              if [[ "$(git rev-parse "$remote_ref")" == "$last_pushed_commit" ]]; then
                printf 'The push was reflected on the remote despite its failure status.\n'
                exit 0
              fi
            else
              printf 'Could not verify whether the failed push was reflected on the remote.\n'
            fi

            if (( attempt >= max_attempts )); then
              printf 'Push failed after %s attempts with status %s.\n' "$attempt" "$push_status"
              exit "$push_status"
            fi

            sleep_seconds=$((attempt < 10 ? attempt : 10))
            printf 'Push failed with status %s; rebuilding and retrying attempt %s with observed_at=%s after %ss.\n' \
              "$push_status" "$((attempt + 1))" "$observed_at" "$sleep_seconds"
            sleep "$sleep_seconds"
          done
